<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<title>Feliz 10 meses ❤️</title>

<style>
body {
    margin: 0;
    height: 100vh;
    overflow: hidden;
    font-family: Arial, sans-serif;
    color: white;
    display: flex;
    justify-content: center;
    align-items: center;
    flex-direction: column;
}

/* 🌌 FONDO GALAXIA REAL */
body::before {
    content: "";
    position: fixed;
    width: 100%;
    height: 100%;
    background: url("https://images.unsplash.com/photo-1462331940025-496dfbfc7564") no-repeat center center/cover;
    z-index: -3;
    filter: brightness(0.5);
}

/* ✨ ESTRELLAS ANIMADAS */
.stars, .stars2 {
    position: fixed;
    width: 100%;
    height: 100%;
    background: transparent;
    z-index: -2;
}

.stars::after {
    content: "";
    position: absolute;
    width: 2px;
    height: 2px;
    background: white;
    box-shadow:
        50px 100px white,
        200px 300px white,
        400px 150px white,
        600px 500px white,
        800px 200px white,
        1000px 400px white,
        300px 600px white,
        700px 100px white,
        1200px 300px white;
    animation: twinkle 2s infinite alternate;
}

.stars2::after {
    content: "";
    position: absolute;
    width: 3px;
    height: 3px;
    background: #fff;
    box-shadow:
        150px 250px #fff,
        350px 450px #fff,
        650px 150px #fff,
        950px 350px #fff;
    animation: twinkle 3s infinite alternate;
}

@keyframes twinkle {
    from { opacity: 0.2; }
    to { opacity: 1; }
}

/* 🪐 PLANETAS */
.planet {
    position: absolute;
    border-radius: 50%;
    z-index: -1;
}

.planet1 {
    width: 120px;
    height: 120px;
    background: radial-gradient(circle, #ff7b00, #8b0000);
    top: 10%;
    left: 10%;
    animation: float 6s ease-in-out infinite;
}

.planet2 {
    width: 80px;
    height: 80px;
    background: radial-gradient(circle, #00c3ff, #002fff);
    bottom: 15%;
    right: 10%;
    animation: float 8s ease-in-out infinite;
}

/* movimiento suave */
@keyframes float {
    0% { transform: translateY(0); }
    50% { transform: translateY(-20px); }
    100% { transform: translateY(0); }
}

/* 📸 FOTOS */
.photos {
    display: flex;
    gap: 20px;
    z-index: 2;
}

.photos img {
    width: 130px;
    height: 130px;
    object-fit: cover;
    border-radius: 15px;
    border: 3px solid white;
    box-shadow: 0 0 20px rgba(255,255,255,0.8);
    transition: transform 0.3s;
}

.photos img:hover {
    transform: scale(1.1);
}

/* 💖 TITULO */
h1 {
    margin-top: 20px;
    font-size: 2.7em;
    text-shadow: 0 0 15px pink, 0 0 25px purple;
}

/* 💌 MENSAJE */
.mensaje {
    display: none;
    margin-top: 10px;
    font-size: 1.2em;
    text-align: center;
    max-width: 500px;
    color: #ffd1f7;
    text-shadow: 0 0 10px purple;
}

/* 🔘 BOTON */
button {
    margin-top: 15px;
    padding: 10px 20px;
    border: none;
    border-radius: 20px;
    background: pink;
    color: black;
    font-weight: bold;
    cursor: pointer;
    box-shadow: 0 0 10px pink;
}

button:hover {
    background: hotpink;
    transform: scale(1.1);
}
</style>

</head>
<body>

<div class="stars"></div>
<div class="stars2"></div>

<div class="planet planet1"></div>
<div class="planet planet2"></div>

<div class="photos">
    <img src="/Fotos/IMGGG234.jpeg">
    <img src="/Fotos/IMGGG236.jpeg">
    <img src="/Fotos/IMGGG237.png">
</div>

<h1>💖 Feliz 10 Meses Mi Princesa💖</h1>

<button onclick="mostrarMensaje()">💌 Ver mensaje</button>

<p id="mensaje" class="mensaje">
    Cada día contigo es un regalo de Dios, eres una bendición que le agradezco a Dios cada día 
    "Todo lo podemos en aquel que nos fortalece...Filipenses 4:13" que sigamos creciendo juntos 
    con amor y de la mano de Dios mi niña hermosa💖Jag älskar dig mycket
</p>

<script>
function mostrarMensaje() {
    document.getElementById("mensaje").style.display = "block";
}
</script>

</body>
</html>
